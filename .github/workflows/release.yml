name: Release

on:
  workflow_dispatch:
    inputs:
      project:
        type: choice
        description: "Em qual projeto deve ser realizado um novo build"
        required: true
        options:
          - ubuntu

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/bake-action@v6
        with:
          push: true
          targets: ${{ inputs.project }}
